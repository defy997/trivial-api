# Nginx server block for TrivialDB frontend + API reverse proxy
# Place this file as /etc/nginx/sites-available/trivial.conf and symlink to sites-enabled,
# or use it as the config when running an nginx container.

server {
    listen 80;
    server_name _;

    # Proxy API requests to backend running on localhost:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache_bypass $http_upgrade;
    }

    # Serve static frontend files (build output)
    # Update root to point to where frontend/dist is deployed (example: /var/www/trivial-frontend)
    root /var/www/trivial-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: increase client body size for large uploads
    client_max_body_size 10M;

    # Logging (optional)
    access_log /var/log/nginx/trivial_access.log;
    error_log  /var/log/nginx/trivial_error.log;
}


